spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 배치 Job + 일반 HTTP 요청 동시 처리를 위해 기본값(10)보다 상향
      # RDS db.t3.micro 최대 Connection 수(~66) 대비 여유 확보
      maximum-pool-size: 20
      connection-timeout: 30000   # 30초 초과 시 예외
      idle-timeout: 600000        # 10분 유휴 후 반환
      max-lifetime: 1800000       # 30분 후 강제 재생성
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  batch:
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      cookie:
        # 운영 HTTPS 환경에서는 JWT 쿠키가 평문 HTTP로 전송되지 않도록 Secure 기본값을 true로 둔다.
        secure: ${JWT_COOKIE_SECURE:true}
        same-site: ${JWT_COOKIE_SAME_SITE:Lax}
        # CSRF 쿠키를 프론트(boot-signal.com)에서 JS로 읽으려면 상위 도메인으로 발급해야 한다.
        domain: ${JWT_COOKIE_DOMAIN:.boot-signal.com}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
