spring:
  application:
    name: bootsignal
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ── Spring Batch 설정 ──
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:bootsignal}
      secret: ${JWT_SECRET:local-development-jwt-secret-change-before-deploy-32bytes}
      access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
      refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:bootsignal-local}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
 
  hrd:
    api:
      auth-key: ${HRD_API_AUTH_KEY:}
      base-url: https://www.work24.go.kr/cm/openApi/call/hr
      return-type: JSON
  work24:
    crawler:
      default-course-url: "${WORK24_CRAWLER_DEFAULT_COURSE_URL:https://www.work24.go.kr/hr/a/a/3100/selectTracseDetl.do?tracseId=AIG20250000501645&tracseTme=4&crseTracseSe=C0061&trainstCstmrId=500020021537}"
      output-path: ${WORK24_CRAWLER_OUTPUT_PATH:build/crawled/work24-training-course-overview.json}
      timeout-millis: ${WORK24_CRAWLER_TIMEOUT_MILLIS:10000}
      user-agent: ${WORK24_CRAWLER_USER_AGENT:Mozilla/5.0 BootSignalCrawler/1.0}
