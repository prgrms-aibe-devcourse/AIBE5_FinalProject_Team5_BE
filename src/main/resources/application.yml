spring:
  application:
    name: bootsignal
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ── Spring Batch 설정 ──
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:bootsignal}
      secret: ${JWT_SECRET:local-development-jwt-secret-change-before-deploy-32bytes}
      access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
      refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}
    token-encryption:
      secret: ${TOKEN_ENCRYPTION_SECRET}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      client-secret: ${GOOGLE_CLIENT_SECRET:}   
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      jwk-set-uri: ${KAKAO_JWK_SET_URI:https://kauth.kakao.com/.well-known/jwks.json}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:bootsignal-local}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
 
  hrd:
    api:
      auth-key: ${HRD_API_AUTH_KEY:}
      base-url: https://www.work24.go.kr/cm/openApi/call/hr
      return-type: JSON
  work24:
    crawler:
      default-course-url: "${WORK24_CRAWLER_DEFAULT_COURSE_URL:https://www.work24.go.kr/hr/a/a/3100/selectTracseDetl.do?tracseId=AIG20240000498288&tracseTme=7&crseTracseSe=C0061&trainstCstmrId=500036172479}"
      output-path: ${WORK24_CRAWLER_OUTPUT_PATH:build/crawled/work24-training-course-overview.json}
      timeout-millis: ${WORK24_CRAWLER_TIMEOUT_MILLIS:30000}
      user-agent: ${WORK24_CRAWLER_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36}
  profile-image:
    # 저장소 유형 : (local: 로컬 임시 저장), (s3: s3 저장) 
    storage-type: ${PROFILE_IMAGE_STORAGE_TYPE:local}
    local:
      upload-dir: ${PROFILE_IMAGE_UPLOAD_DIR:temp-storage/profile-images}
      public-path-prefix: ${PROFILE_IMAGE_PUBLIC_PATH_PREFIX:/local-files/profile}
      base-url: ${PROFILE_IMAGE_BASE_URL:http://localhost:8080}
    s3:
      # S3 저장 관련 설정 예정
  calendar:
    google:
      redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/calendar/connect/google/callback}
      scope: ${GOOGLE_CALENDAR_SCOPE:openid email profile https://www.googleapis.com/auth/calendar.events}
      connect-success-url: ${GOOGLE_CALENDAR_CONNECT_SUCCESS_URL:http://localhost:5173/dashboard/schedule}
      connect-failure-url: ${GOOGLE_CALENDAR_CONNECT_FAILURE_URL:http://localhost:5173/dashboard/schedule}
